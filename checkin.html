<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In — Fitness Club</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="mark">COLLEGE <span>FITNESS CLUB</span></div>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="my-progress.html">My Progress</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>
</div>

<div class="wrap" style="max-width:440px; padding-top:80px; text-align:center;" id="content">
  <!-- filled in by script -->
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import {
    doc, getDoc, setDoc, collection, addDoc, query, where, getDocs, limit, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const content = document.getElementById('content');
  const STORAGE_KEY = 'fitness_club_member_roll';

  // NIT Nagaland gym — check-in only works within this radius.
  // To adjust: update these three numbers.
  const GYM_LAT = 25.789581;
  const GYM_LNG = 93.775825;
  const MAX_DISTANCE_METERS = 35;

  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = deg => deg * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function getCurrentLocation() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject({ code: 0, message: 'Location is not supported on this device or browser.' });
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => resolve(pos.coords),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
      );
    });
  }

  // Original lines written for this app — not quoting any real person, so
  // there's no copyright issue reproducing them. One is picked based on
  // the date, so everyone sees the same "quote of the day" and it changes
  // automatically at midnight — no API, no daily upkeep.
  const QUOTES = [
    "Showing up is the hard part. You just did it.",
    "Discipline is just a promise you keep to yourself.",
    "Small reps, repeated, become a different body.",
    "Nobody regrets the workout they finished.",
    "Consistency beats intensity, every single time.",
    "You didn't come this far to only come this far.",
    "The gym doesn't care how you feel. Show up anyway.",
    "Progress is boring day to day and obvious year to year.",
    "Today's effort is tomorrow's strength.",
    "You're not too tired. You're one set away from feeling better.",
    "Every rep is a vote for the person you're becoming.",
    "Motivation gets you here. Habit keeps you here.",
    "The hardest part was walking through the door. Done.",
    "Strong isn't a look — it's a habit you're building.",
    "You beat the version of you that stayed home.",
    "Nobody's watching. Do it for the quiet win.",
    "Some days you go for a PR. Today, you just went.",
    "Your future self is grateful you didn't skip today.",
    "Effort compounds. So does avoiding it.",
    "This is the part where most people quit. You didn't.",
    "You don't need to feel ready. You just need to start.",
    "One more rep than yesterday is still progress.",
    "The body achieves what the mind believes it can repeat.",
    "You're building evidence that you keep your promises.",
    "Bad days at the gym still beat good days on the couch.",
    "The work you do when no one's counting is the work that counts.",
    "Discomfort today, capability tomorrow.",
    "You showed up. That's the whole game.",
    "Streaks aren't built in a day, but they're broken in one you skip.",
    "Strength is just discomfort you've done before.",
  ];

  function getTodaysQuote() {
    const start = new Date(new Date().getFullYear(), 0, 0);
    const diff = Date.now() - start.getTime();
    const dayOfYear = Math.floor(diff / 86400000);
    return QUOTES[dayOfYear % QUOTES.length];
  }

  function renderStatus(titleText, bodyHtml, color) {
    content.innerHTML = `
      <h1 class="display" style="font-size:56px; margin:0 0 24px; color:${color};">${titleText}</h1>
      <div style="font-size:16px; color:var(--ink-dim);">${bodyHtml}</div>
    `;
  }

  function renderStatusWithQuote(titleText, bodyHtml, color) {
    content.innerHTML = `
      <h1 class="display" style="font-size:56px; margin:0 0 24px; color:${color};">${titleText}</h1>
      <div style="font-size:16px; color:var(--ink-dim); margin-bottom:32px;">${bodyHtml}</div>
      <div class="card" style="text-align:left;">
        <div style="font-size:11px; letter-spacing:0.06em; color:var(--volt); margin-bottom:8px;">QUOTE OF THE DAY</div>
        <div style="font-size:16px; line-height:1.5;">"${getTodaysQuote()}"</div>
      </div>
    `;
  }

  function renderSetupForm(errorMsg) {
    content.innerHTML = `
      <h1 class="display" style="font-size:48px; margin:0 0 8px;">WHO'S CHECKING IN?</h1>
      <p style="color:var(--ink-dim); margin-bottom:28px;">First time on this phone. Already registered? Just enter your roll number. New here? Add your name too — you'll only ever need to do this once.</p>
      <form id="setup-form">
        <input type="text" id="name-input" placeholder="Full name (only needed if you're new)" autocomplete="off" style="margin-bottom:12px;">
        <input type="text" id="roll-input" placeholder="Roll number" autocomplete="off" required autofocus>
        <button type="submit" style="width:100%; margin-top:12px;">Continue</button>
      </form>
      <div id="setup-error" class="msg-err" style="margin-top:16px; font-size:14px;">${errorMsg || ''}</div>
    `;

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const roll = document.getElementById('roll-input').value.trim();
      const typedName = document.getElementById('name-input').value.trim();
      if (!roll) return;

      try {
        const memberRef = doc(db, 'members', roll);
        const memberSnap = await getDoc(memberRef);

        if (memberSnap.exists()) {
          // Already registered — just remember this device and check in.
          localStorage.setItem(STORAGE_KEY, roll);
          await checkIn(roll, memberSnap.data().full_name);
          return;
        }

        if (!typedName) {
          renderSetupForm('That roll number isn\'t registered yet. Enter your name above too to register it.');
          return;
        }

        // Self-register a brand new roll number. Firestore rules only
        // allow this when the roll number isn't already taken.
        await setDoc(memberRef, { full_name: typedName, roll_number: roll, created_at: serverTimestamp() });
        localStorage.setItem(STORAGE_KEY, roll);
        await checkIn(roll, typedName);
      } catch (err) {
        console.error('Setup failed:', err);
        renderSetupForm(`Something went wrong: ${err.message || err.code || 'unknown error'}`);
      }
    });
  }

  async function checkIn(roll, fallbackName) {
    renderStatus('CHECKING IN…', 'Confirming your location.', 'var(--ink)');

    let coords;
    try {
      coords = await getCurrentLocation();
    } catch (err) {
      let msg = 'We need your location to check you in at the gym. Allow location access and scan again.';
      if (err.code === 1) msg = 'Location access was denied. Enable location for this site in your browser settings, then scan again.';
      else if (err.code === 2) msg = 'Could not determine your location. Make sure GPS/location services are turned on, then try again.';
      else if (err.code === 3) msg = 'Location request timed out. Try again.';
      renderStatus('CAN\'T CHECK IN', msg, 'var(--alert)');
      return;
    }

    const distance = distanceMeters(coords.latitude, coords.longitude, GYM_LAT, GYM_LNG);
    if (distance > MAX_DISTANCE_METERS) {
      renderStatus('TOO FAR FROM THE GYM', `You need to be at the gym to check in — you appear to be about ${Math.round(distance)}m away.`, 'var(--alert)');
      return;
    }

    try {
      const memberSnap = await getDoc(doc(db, 'members', roll));
      if (!memberSnap.exists()) {
        localStorage.removeItem(STORAGE_KEY);
        renderSetupForm('Your saved registration wasn\'t found. Please re-enter your roll number.');
        return;
      }
      const full_name = memberSnap.data().full_name || fallbackName;

      // Prevent duplicate check-ins on the same day. This only filters by
      // member_id (no composite index needed) and checks the date in JS.
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const existingQuery = query(
        collection(db, 'attendance'),
        where('member_id', '==', roll),
        limit(20)
      );
      const existingSnap = await getDocs(existingQuery);
      const alreadyToday = existingSnap.docs.some(d => {
        const ts = d.data().checked_in_at;
        return ts && ts.toDate() >= startOfToday;
      });

      if (alreadyToday) {
        renderStatusWithQuote('ALREADY IN', `You already checked in today, <strong style="color:var(--ink);">${full_name}</strong>.`, 'var(--volt)');
        return;
      }

      await addDoc(collection(db, 'attendance'), {
        member_id: roll,
        full_name: full_name,
        checked_in_at: serverTimestamp()
      });

      renderStatusWithQuote('CHECKED IN', `Nice work, <strong style="color:var(--ink);">${full_name}</strong>. See you at the gym.`, 'var(--volt)');
    } catch (err) {
      console.error('Check-in failed:', err);
      renderStatus('CAN\'T CHECK IN', `Something went wrong: ${err.message || err.code || 'unknown error'}`, 'var(--alert)');
    }
  }

  // Entry point: if this device already knows who you are, check in
  // instantly. Otherwise ask once.
  const savedRoll = localStorage.getItem(STORAGE_KEY);
  if (savedRoll) {
    checkIn(savedRoll);
  } else {
    renderSetupForm();
  }
</script>

</body>
</html>
