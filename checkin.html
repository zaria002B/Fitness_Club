<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In — Fitness Club</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="mark">COLLEGE <span>FITNESS CLUB</span></div>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>
</div>

<div class="wrap" style="max-width:440px; padding-top:96px; text-align:center;">
  <h1 class="display" style="font-size:56px; margin:0 0 24px;" id="status-title">CHECKING IN…</h1>
  <div id="status-body" style="font-size:16px; color:var(--ink-dim);">Reading your QR code.</div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import {
    doc, getDoc, collection, addDoc, query, where, getDocs, limit, serverTimestamp, Timestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const title = document.getElementById('status-title');
  const body = document.getElementById('status-body');

  function showError(message) {
    title.textContent = 'CAN\'T CHECK IN';
    title.style.color = 'var(--alert)';
    body.innerHTML = message;
  }

  function showSuccess(name, alreadyToday) {
    title.textContent = alreadyToday ? 'ALREADY IN' : 'CHECKED IN';
    title.style.color = 'var(--volt)';
    body.innerHTML = alreadyToday
      ? `You already checked in today, <strong style="color:var(--ink);">${name}</strong>.`
      : `Nice work, <strong style="color:var(--ink);">${name}</strong>. See you at the gym.`;
  }

  async function run() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      showError('This link is missing your personal check-in code. Please scan the QR code the club gave you — don\'t type this address in manually.');
      return;
    }

    try {
      const tokenSnap = await getDoc(doc(db, 'tokens', token));
      if (!tokenSnap.exists()) {
        showError('This QR code isn\'t recognized. Ask a club admin to check your registration.');
        return;
      }

      const { roll_number, full_name } = tokenSnap.data();

      // Prevent duplicate check-ins on the same day.
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const existingQuery = query(
        collection(db, 'attendance'),
        where('member_id', '==', roll_number),
        where('checked_in_at', '>=', Timestamp.fromDate(startOfToday)),
        limit(1)
      );
      const existingSnap = await getDocs(existingQuery);

      if (!existingSnap.empty) {
        showSuccess(full_name, true);
        return;
      }

      await addDoc(collection(db, 'attendance'), {
        member_id: roll_number,
        full_name: full_name,
        checked_in_at: serverTimestamp()
      });

      showSuccess(full_name, false);
    } catch (err) {
      showError('Something went wrong logging your check-in. Try scanning again.');
    }
  }

  run();
</script>

</body>
</html>
