<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check In — Fitness Club</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="mark">COLLEGE <span>FITNESS CLUB</span></div>
    <div class="nav">
      <a href="index.html">Home</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>
</div>

<div class="wrap" style="max-width:440px; padding-top:80px; text-align:center;" id="content">
  <!-- filled in by script -->
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import {
    doc, getDoc, collection, addDoc, query, where, getDocs, limit, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const content = document.getElementById('content');
  const STORAGE_KEY = 'fitness_club_member_roll';

  function renderStatus(titleText, bodyHtml, color) {
    content.innerHTML = `
      <h1 class="display" style="font-size:56px; margin:0 0 24px; color:${color};">${titleText}</h1>
      <div style="font-size:16px; color:var(--ink-dim);">${bodyHtml}</div>
    `;
  }

  function renderSwitchLink() {
    const el = document.createElement('div');
    el.style.marginTop = '32px';
    el.innerHTML = `<a href="#" id="switch-link" style="color:var(--ink-dim); font-size:13px; text-decoration:underline;">Not you? Switch member</a>`;
    content.appendChild(el);
    document.getElementById('switch-link').addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem(STORAGE_KEY);
      renderSetupForm();
    });
  }

  function renderSetupForm(errorMsg) {
    content.innerHTML = `
      <h1 class="display" style="font-size:48px; margin:0 0 8px;">WHO'S CHECKING IN?</h1>
      <p style="color:var(--ink-dim); margin-bottom:28px;">First time on this phone — enter your roll number once. It'll be remembered here so future scans are instant.</p>
      <form id="setup-form">
        <input type="text" id="roll-input" placeholder="Roll number" autocomplete="off" autofocus required>
        <button type="submit" style="width:100%; margin-top:12px;">Continue</button>
      </form>
      <div id="setup-error" class="msg-err" style="margin-top:16px; font-size:14px;">${errorMsg || ''}</div>
    `;

    document.getElementById('setup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const roll = document.getElementById('roll-input').value.trim();
      if (!roll) return;

      const memberSnap = await getDoc(doc(db, 'members', roll));
      if (!memberSnap.exists()) {
        renderSetupForm('Roll number not found. Ask a club admin to register you first.');
        return;
      }

      localStorage.setItem(STORAGE_KEY, roll);
      await checkIn(roll, memberSnap.data().full_name);
    });
  }

  async function checkIn(roll, fallbackName) {
    renderStatus('CHECKING IN…', 'One moment.', 'var(--ink)');

    try {
      const memberSnap = await getDoc(doc(db, 'members', roll));
      if (!memberSnap.exists()) {
        localStorage.removeItem(STORAGE_KEY);
        renderSetupForm('Your saved registration wasn\'t found. Please re-enter your roll number.');
        return;
      }
      const full_name = memberSnap.data().full_name || fallbackName;

      // Prevent duplicate check-ins on the same day. This only filters by
      // member_id (no composite index needed) and checks the date in JS.
      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const existingQuery = query(
        collection(db, 'attendance'),
        where('member_id', '==', roll),
        limit(20)
      );
      const existingSnap = await getDocs(existingQuery);
      const alreadyToday = existingSnap.docs.some(d => {
        const ts = d.data().checked_in_at;
        return ts && ts.toDate() >= startOfToday;
      });

      if (alreadyToday) {
        renderStatus('ALREADY IN', `You already checked in today, <strong style="color:var(--ink);">${full_name}</strong>.`, 'var(--volt)');
        renderSwitchLink();
        return;
      }

      await addDoc(collection(db, 'attendance'), {
        member_id: roll,
        full_name: full_name,
        checked_in_at: serverTimestamp()
      });

      renderStatus('CHECKED IN', `Nice work, <strong style="color:var(--ink);">${full_name}</strong>. See you at the gym.`, 'var(--volt)');
      renderSwitchLink();
    } catch (err) {
      console.error('Check-in failed:', err);
      renderStatus('CAN\'T CHECK IN', `Something went wrong: ${err.message || err.code || 'unknown error'}`, 'var(--alert)');
    }
  }

  // Entry point: if this device already knows who you are, check in
  // instantly. Otherwise ask once.
  const savedRoll = localStorage.getItem(STORAGE_KEY);
  if (savedRoll) {
    checkIn(savedRoll);
  } else {
    renderSetupForm();
  }
</script>

</body>
</html>
